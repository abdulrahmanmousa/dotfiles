# Enable backend
backend = "xrender";

# General settings
active-opacity = 1.0;
inactive-opacity = 0.9;

# Blur settings
blur-method = "kawase";  # You can try "box" or "gaussian" as alternatives
blur-strength = 7;       # Adjust this value for stronger/weaker blur
blur-background = true;

# Enable blur for specific windows (GNOME Terminal in this case)
opacity-rule = [
    "90:class_g = 'Gnome-terminal'"
];

# Transparency for GNOME Terminal
focus-exclude = [ ];
shadow = false;
shadow-radius = 0;
